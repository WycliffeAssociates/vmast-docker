# Development overrides. docker-compose.yml passes no env_file at all, so the
# five services that read configuration get it back here - locally the values
# come from a plaintext .env rather than from `op run`.
services:
  web:
    develop:
      watch:
        - action: sync
          path: ./php/htdocs/webapp/www
          target: /usr/share/nginx/html
          ignore:
            - vendor/
        - action: rebuild
          path: ./php/htdocs/webapp/www/composer.json
    volumes:
      - ./db/dump:/db_dump

  php:
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./php/htdocs/webapp/www
          target: /usr/share/nginx/html
          ignore:
            - vendor/
            # Bind mounted below, so the container already sees these live and
            # syncing them would copy a gigabyte for nothing.
            - app/Storage/
            - app/Templates/Default/Assets/fonts/uploads/
        - action: rebuild
          path: ./php/htdocs/webapp/www/composer.json
    volumes:
      # Same mount points as docker-compose.yml, backed by the working tree
      # instead of named volumes: what the sync script unpacks on the host is
      # visible in the container immediately, with nothing to copy.
      - ./php/htdocs/webapp/www/app/Storage:/usr/share/nginx/html/app/Storage
      - ./php/htdocs/webapp/www/app/Templates/Default/Assets/fonts/uploads:/usr/share/nginx/html/app/Templates/Default/Assets/fonts/uploads
    # volumes:
    # - ./php/htdocs:/var/www/html
    # - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf

  db:
    env_file:
      - .env

  db-backup:
    env_file:
      - .env

  node:
    env_file:
      - .env

  # db:
  # volumes:
  # - dbdata:/var/lib/mysql
  # - Probably take out? Maybe leave as a bind?
  # - ./db/conf:/etc/mysql/mysql.conf.d
  # - ./db/backup:/backup
  # restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 512M
    ports:
      - 8081:80

